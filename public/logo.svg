<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D7BFF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="rr">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- "A" letterform: two legs + crossbar, open at bottom -->
  <polygon points="50,18 20,78 32,78 50,38 68,78 80,78" fill="white"/>
  <!-- triangular cutout / counter -->
  <polygon points="50,45 38,74 62,74" fill="url(#bg)"/>
  <!-- crossbar -->
  <rect x="33" y="58" width="34" height="7" rx="2" fill="white"/>
</svg>
